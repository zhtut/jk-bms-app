name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
          - os: ubuntu-latest
            artifact: web
          - os: macos-latest
            artifact: macos

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux 构建依赖
        if: matrix.artifact == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev zip

      - name: 构建 Windows
        if: matrix.artifact == 'windows'
        run: flutter build windows --release

      - name: 构建 Linux
        if: matrix.artifact == 'linux'
        run: flutter build linux --release

      - name: 构建 Web
        if: matrix.artifact == 'web'
        run: flutter build web --release

      - name: 构建 macOS
        if: matrix.artifact == 'macos'
        run: flutter build macos --release

      - name: 打包 Windows
        if: matrix.artifact == 'windows'
        shell: pwsh
        run: |
          $dir = Get-ChildItem build/windows -Recurse -Directory -Filter Release |
            Where-Object { $_.FullName -match 'runner' } | Select-Object -First 1
          Compress-Archive -Path "$($dir.FullName)\*" `
            -DestinationPath "jkbms-monitor-${{ github.ref_name }}-windows-x64.zip"

      - name: 打包 Linux
        if: matrix.artifact == 'linux'
        run: |
          cd build/linux/x64/release/bundle
          zip -rq "$GITHUB_WORKSPACE/jkbms-monitor-${{ github.ref_name }}-linux-x64.zip" .

      - name: 打包 Web
        if: matrix.artifact == 'web'
        run: |
          cd build/web
          zip -rq "$GITHUB_WORKSPACE/jkbms-monitor-${{ github.ref_name }}-web.zip" .

      - name: 打包 macOS
        if: matrix.artifact == 'macos'
        run: |
          cd build/macos/Build/Products/Release
          zip -ryq "$GITHUB_WORKSPACE/jkbms-monitor-${{ github.ref_name }}-macos.zip" *.app

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: jkbms-monitor-*
          fail_on_unmatched_files: true
          generate_release_notes: true
